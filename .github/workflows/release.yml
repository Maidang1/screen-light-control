name: Build and release Windows EXE

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: .\test.ps1
      - name: Build portable application
        run: .\build.ps1
      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: ScreenLight-windows
          path: |
            dist/ScreenLight.exe
            dist/ScreenLight.exe.config
            dist/ScreenLight-portable.zip
            dist/THIRD-PARTY-NOTICES.txt
            dist/README.md
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ScreenLight-windows
          path: dist
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $assets = @(
            'dist/ScreenLight.exe',
            'dist/ScreenLight.exe.config',
            'dist/ScreenLight-portable.zip',
            'dist/THIRD-PARTY-NOTICES.txt',
            'dist/README.md'
          )
          gh release view "$env:RELEASE_TAG" --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$env:RELEASE_TAG" @assets --clobber
          } else {
            gh release create "$env:RELEASE_TAG" @assets --verify-tag --generate-notes --title "Screen Light $env:RELEASE_TAG"
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
